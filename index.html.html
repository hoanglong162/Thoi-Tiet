<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bản Đồ Mây Mưa - Realtime & Forecast</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            background-color: #1e1e24;
        }
        #map {
            width: 100%;
            height: 100%;
        }

        /* Header thông tin */
        .top-header {
            position: absolute;
            top: 12px;
            left: 12px;
            z-index: 1000;
            background: rgba(15, 15, 20, 0.88);
            color: #fff;
            padding: 12px 18px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            backdrop-filter: blur(6px);
            border: 1px solid rgba(255,255,255,0.1);
        }
        .top-header h2 {
            margin: 0;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            color: #ff4757;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .live-badge {
            background: #ff4757;
            color: white;
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: bold;
            animation: blink 1.5s infinite;
        }
        .top-header p {
            margin: 6px 0 0 0;
            font-size: 12px;
            color: #ccc;
        }

        /* Thanh điều khiển Playback Timeline */
        .player-control {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            background: rgba(20, 20, 25, 0.92);
            color: white;
            padding: 10px 22px;
            border-radius: 30px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.6);
            display: flex;
            align-items: center;
            gap: 15px;
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255,255,255,0.15);
        }
        .play-btn {
            background: #0088ff;
            border: none;
            color: white;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }
        .play-btn:hover {
            background: #0066cc;
            transform: scale(1.05);
        }
        .timeline-slider {
            width: 280px;
            cursor: pointer;
            accent-color: #0088ff;
        }
        .time-display {
            font-size: 13px;
            font-weight: 600;
            min-width: 170px;
            text-align: center;
            color: #4facfe;
        }

        /* Warning Badge khi không có dữ liệu forecast từ API */
        .status-note {
            font-size: 11px;
            color: #eccc68;
            margin-top: 4px;
        }

        /* Marker vị trí */
        .user-location-marker {
            display: flex;
            align-items: center;
            white-space: nowrap;
        }
        .blue-dot-ring {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background-color: #0088ff;
            border: 3px solid #ffffff;
            box-shadow: 0 0 10px rgba(0,136,255,0.9);
            animation: pulse 2s infinite;
        }
        .marker-label {
            margin-left: 8px;
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 3px 8px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 12px;
            border: 1px solid rgba(255,255,255,0.3);
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(0, 136, 255, 0.7); }
            70% { box-shadow: 0 0 0 12px rgba(0, 136, 255, 0); }
            100% { box-shadow: 0 0 0 0 rgba(0, 136, 255, 0); }
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
    </style>
</head>
<body>

    <div class="top-header">
        <h2><span class="live-badge">LIVE</span> THEO DÕI MÂY MƯA RADAR</h2>
        <p id="location-text">VỊ TRÍ: (10.822, 106.802) | Đang kết nối dữ liệu vệ tinh...</p>
        <div id="status-note" class="status-note"></div>
    </div>

    <div id="map"></div>

    <div class="player-control">
        <button id="play-btn" class="play-btn" onclick="togglePlay()">▶</button>
        <input type="range" id="timeline" class="timeline-slider" min="0" value="0" step="1" oninput="onSliderChange(this.value)">
        <div id="time-display" class="time-display">Đang tải dữ liệu...</div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        var centerLat = 10.820;
        var centerLng = 106.755;
        
        var map = L.map('map', {
            center: [centerLat, centerLng],
            zoom: 10,
            minZoom: 3,
            maxZoom: 15,
            zoomControl: false
        });

        // Bản đồ nền CartoDB Voyager
        L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; OpenStreetMap &copy; CARTO',
            maxZoom: 19,
            subdomains: 'abcd'
        }).addTo(map);

        L.control.zoom({ position: 'topright' }).addTo(map);

        var animationFrames = [];
        var radarLayers = {};
        var currentIndex = 0;
        var isPlaying = false;
        var playInterval = null;
        var apiHost = '';
        var lastPastIndex = 0;
        var transparentPixel = 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=';

        function loadRadarData() {
            fetch('https://api.rainviewer.com/public/weather-maps.json')
                .then(response => response.json())
                .then(data => {
                    if (!data) return;
                    apiHost = data.host;
                    
                    var pastFrames = data.radar.past || [];
                    var nowcastFrames = data.radar.nowcast || [];
                    
                    lastPastIndex = pastFrames.length - 1;
                    
                    // Kiểm tra xem API có trả về dữ liệu dự báo (nowcast) không
                    if (nowcastFrames.length === 0) {
                        document.getElementById('status-note').innerText = '⚠️ API miễn phí hiện chưa có dữ liệu dự báo tương lai. Đang hiển thị chuỗi mây thực tế.';
                        animationFrames = pastFrames;
                    } else {
                        document.getElementById('status-note').innerText = '✅ Đã tải dữ liệu thực tế và dự báo tương lai.';
                        animationFrames = pastFrames.concat(nowcastFrames);
                    }

                    if (animationFrames.length === 0) return;

                    var slider = document.getElementById('timeline');
                    slider.max = animationFrames.length - 1;
                    
                    currentIndex = lastPastIndex >= 0 ? lastPastIndex : 0;
                    slider.value = currentIndex;

                    preloadLayers();
                    showFrame(currentIndex);
                })
                .catch(err => {
                    console.error("Lỗi tải dữ liệu radar:", err);
                    document.getElementById('status-note').innerText = '❌ Không thể kết nối tới máy chủ dữ liệu Radar.';
                });
        }

        function preloadLayers() {
            animationFrames.forEach(frame => {
                if (!radarLayers[frame.path]) {
                    var tileUrl = apiHost + frame.path + '/512/{z}/{x}/{y}/2/1_1.png';
                    radarLayers[frame.path] = L.tileLayer(tileUrl, {
                        opacity: 0.65,
                        zIndex: 500,
                        tileSize: 512,
                        zoomOffset: -1,
                        minNativeZoom: 1,
                        maxNativeZoom: 7,
                        errorTileUrl: transparentPixel
                    });
                }
            });
        }

        function showFrame(index) {
            if (index < 0 || index >= animationFrames.length) return;

            var frame = animationFrames[index];
            var isForecast = index > lastPastIndex; 
            
            var timeStr = new Date(frame.time * 1000).toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' });
            var label = isForecast ? timeStr + ' (Dự báo)' : timeStr + ' (Thực tế)';

            document.getElementById('time-display').innerText = label;
            document.getElementById('time-display').style.color = isForecast ? '#ff4757' : '#4facfe';
            document.getElementById('timeline').value = index;

            Object.keys(radarLayers).forEach(path => {
                if (path === frame.path) {
                    if (!map.hasLayer(radarLayers[path])) {
                        map.addLayer(radarLayers[path]);
                    }
                } else {
                    if (map.hasLayer(radarLayers[path])) {
                        map.removeLayer(radarLayers[path]);
                    }
                }
            });
        }

        function togglePlay() {
            var btn = document.getElementById('play-btn');
            if (isPlaying) {
                clearInterval(playInterval);
                isPlaying = false;
                btn.innerText = '▶';
            } else {
                isPlaying = true;
                btn.innerText = '❚❚';
                playInterval = setInterval(function () {
                    currentIndex++;
                    if (currentIndex >= animationFrames.length) {
                        currentIndex = 0;
                    }
                    showFrame(currentIndex);
                }, 650);
            }
        }

        function onSliderChange(val) {
            currentIndex = parseInt(val);
            if (isPlaying) {
                togglePlay();
            }
            showFrame(currentIndex);
        }

        loadRadarData();
        setInterval(loadRadarData, 300000);

        // Marker Ghim Vị Trí
        var userPos = [10.822, 106.802];
        var userIcon = L.divIcon({
            className: 'user-location-marker',
            html: '<div class="blue-dot-ring"></div><div class="marker-label">Vị trí chọn</div>',
            iconSize: [120, 30],
            iconAnchor: [8, 8]
        });
        
        var userMarker = L.marker(userPos, { icon: userIcon }).addTo(map);

        map.on('click', function(e) {
            userPos = [e.latlng.lat, e.latlng.lng];
            userMarker.setLatLng(e.latlng);
            document.getElementById('location-text').innerHTML = 
                'VỊ TRÍ: (' + e.latlng.lat.toFixed(3) + ', ' + e.latlng.lng.toFixed(3) + ') | Đang theo dõi mưa thời gian thực';
        });

    </script>
</body>
</html>
